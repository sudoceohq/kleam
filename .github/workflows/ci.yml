name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  mac:
    name: Mac app build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Kleam.app
        run: bash macos/build.sh
      - name: Confirm the bundle
        run: test -x dist/Kleam.app/Contents/MacOS/Kleam
